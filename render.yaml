# Render Blueprint – free demo web service for EliteNexa.
# NOTE: the free plan has no persistent disk, so the SQLite DB (data/) resets on every restart/spin-down.
# On a fresh DB the app seeds sample products (incl. the ₹1,199 Starter Kit) and the 'admin' account (password from ADMIN_PASSWORD_HASH or ADMIN_PASSWORD).
# DEMO_MODE=1 also seeds 20 demo members + back-dated paid orders for the binary plan (labelled demo data). Set to 0 for real use.
services:
  - type: web
    name: elitenexa
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      # Preferred: bcrypt hash of the admin password (takes precedence over ADMIN_PASSWORD).
      # Generate it on the site itself at /admin/setup-hash?token=<ADMIN_SETUP_TOKEN>.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Temporary (>= 24 chars): enables /admin/setup-hash. Remove it once ADMIN_PASSWORD_HASH is set.
      - key: ADMIN_SETUP_TOKEN
        sync: false
      # Optional: base32 TOTP secret that keeps two-factor authentication ON for the 'admin' account across restarts
      # (the free plan wipes the DB). Copy it from the note shown on /admin/security right after enabling 2FA.
      # Keep it secret: anyone with it can generate the admin's 6-digit codes.
      - key: ADMIN_TOTP_SECRET
        sync: false
